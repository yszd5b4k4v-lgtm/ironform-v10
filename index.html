<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#050814"/>
<title>IronForm v10</title>
<style>
:root{--bg:#050814;--fg:#e8eef8;--muted:#8b9bb4;--iron:#c13a36;--card:#0d1524;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:.04em;text-transform:uppercase}.logo span{color:var(--iron)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.iron{border-color:rgba(193,58,54,.4);color:#e07a76;background:rgba(193,58,54,.12)}
main{padding:16px;padding-bottom:96px;max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.role{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-right:6px}
.role.ANCHOR{background:rgba(193,58,54,.2);color:#e07a76}
.role.CORE{background:rgba(255,255,255,.06);color:var(--muted)}
.role.ROTATE{background:rgba(255,255,255,.04);color:#b0a89e}
nav{position:fixed;bottom:0;left:0;right:0;background:#03060e;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px}
nav button.active{color:var(--iron)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:12px;width:100%;font-weight:700;margin-top:8px}
.setrow{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin-top:6px}
.check{width:32px;height:32px;border:2px solid var(--line);border-radius:4px;background:transparent;color:var(--fg);font-size:14px}
.check.on{background:var(--iron);border-color:var(--iron)}
input[type=text]{width:100%;background:#03060e;border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--fg);margin-top:4px}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">IRON<span>FORM</span></div>
  <div style="display:flex;gap:6px">
    <span class="badge iron" id="qBadge">—</span>
    <span class="badge" id="streakBadge">0d</span>
  </div>
</header>
<main id="app"><div class="empty">Loading v10…</div></main>
<nav>
  <button class="active" data-tab="today" onclick="go('today')">Today</button>
  <button data-tab="log" onclick="go('log')">Log</button>
  <button data-tab="program" onclick="go('program')">Program</button>
  <button data-tab="profile" onclick="go('profile')">Profile</button>
</nav>
<script>
let PROG=null;
const DAY_MAP=['rest','upper_a','lower_a','zone2','upper_b','lower_b','hybrid_power'];
const DAY_LABEL={upper_a:'Upper A — Push',lower_a:'Lower A — Squat',zone2:'Zone 2 / Recovery',upper_b:'Upper B — Pull',lower_b:'Lower B — Hinge',hybrid_power:'Hybrid / Power (Optional)',rest:'Rest / Walk'};
const STORE='ironform.v10.lean';
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}
function save(s){localStorage.setItem(STORE,JSON.stringify(s))}
function state(){const s=load();if(!s.profile)s.profile={name:'Athlete',streak:0,xp:0,level:1,lastDate:null};if(!s.logs)s.logs={};return s}
function todayStr(){return new Date().toLocaleDateString('en-CA')}
function quarterOf(d){const m=d.getMonth();return m<=2?'A':m<=5?'B':m<=8?'C':'D'}
function weekOfYear(d){const start=new Date(d.getFullYear(),0,1);const day=start.getDay();const mo=day===0?-6:1-day;const cs=new Date(start);cs.setDate(start.getDate()+mo);const week=Math.floor((d-cs)/(7*86400000))+1;return((week-1)%52)+1}
function quarterWeek(w){return((w-1)%13)+1}
function isDeload(w){return quarterWeek(w)===13}
function workoutFor(date){
  const dayType=DAY_MAP[date.getDay()];const q=quarterOf(date);const w=weekOfYear(date);const deload=isDeload(w);
  const base={dayType,label:DAY_LABEL[dayType],quarter:PROG[q].name,week:w,quarterWeek:quarterWeek(w),isDeload:deload,isRest:dayType==='rest'||dayType==='zone2',exercises:[]};
  if(base.isRest){if(dayType==='zone2')base.note='25–40 min Zone 2 at conversational pace.';if(deload)base.note='Deload week — keep Zone 2 easy and shorter.';return base}
  if(deload&&dayType==='hybrid_power'){base.isRest=true;base.note='Deload — skip optional Hybrid/Power.';return base}
  let exs=(PROG[q].days[dayType]||[]).map(e=>({...e}));
  if(deload){exs=exs.filter(e=>!(e.role==='ROTATE'&&e.n>=8)).map(e=>({...e,sets:Math.max(1,Math.floor(e.sets/2))}));base.note='Deload — half sets, 2–4 RIR, no grinders.'}
  if(dayType==='hybrid_power')base.note='Optional. Keep RPE 6–7. Skip if Friday was hard.';
  base.exercises=exs;return base;
}
let tab='today';
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function toggleSet(dateStr,dayType,exName,setNum){
  const s=state();const key=dateStr+'|'+dayType;if(!s.logs[key])s.logs[key]={completed:{},done:false};
  const k=exName+'#'+setNum;s.logs[key].completed[k]=!s.logs[key].completed[k];
  const w=workoutFor(new Date(dateStr+'T12:00:00'));let total=0,done=0;
  w.exercises.forEach(ex=>{for(let i=1;i<=ex.sets;i++){total++;if(s.logs[key].completed[ex.name+'#'+i])done++}});
  const wasDone=s.logs[key].done;s.logs[key].done=total>0&&done===total;
  if(s.logs[key].done&&!wasDone){const p=s.profile;const diff=p.lastDate?Math.round((new Date(dateStr+'T12:00:00')-new Date(p.lastDate+'T12:00:00'))/86400000):999;p.streak=(diff>2)?1:(diff<=0?p.streak:(p.streak||0)+1);p.xp=(p.xp||0)+100;p.level=Math.floor(p.xp/500)+1;p.lastDate=dateStr}
  save(s);render();
}
function renderToday(){
  const d=new Date();const w=workoutFor(d);const s=state();const dateStr=todayStr();
  document.getElementById('qBadge').textContent=w.quarter+' · wk '+w.quarterWeek;
  document.getElementById('streakBadge').textContent=(s.profile.streak||0)+'d';
  let html=`<h1>${w.label}</h1><p class="sub">${d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})} · ${w.quarter}</p>`;
  if(w.note)html+=`<p class="note">${w.note}</p>`;
  if(w.isRest)return html+`<div class="card empty">${w.dayType==='zone2'?'Zone 2 day — walk, bike, or easy jog 25–40 min.':'Full rest. Sleep, eat, recover.'}</div>`;
  const log=(s.logs[dateStr+'|'+w.dayType]||{completed:{}}).completed;
  w.exercises.forEach(ex=>{
    html+=`<div class="card"><div class="name"><span class="role ${ex.role}">${ex.role}</span>${ex.name}</div><div class="sets">${ex.sets} × ${ex.reps}</div>`;
    for(let i=1;i<=ex.sets;i++){const on=!!log[ex.name+'#'+i];html+=`<div class="setrow"><button class="check ${on?'on':''}" onclick='toggleSet(${JSON.stringify(dateStr)},${JSON.stringify(w.dayType)},${JSON.stringify(ex.name)},${i})'>${on?'✓':i}</button><span style="font-size:12px;color:var(--muted)">Set ${i}</span></div>`}
    html+=`</div>`;
  });
  return html;
}
function renderProgram(){
  const q=quarterOf(new Date());
  let html=`<h1>Program</h1><p class="sub">Quarterly Hybrid v10 · 11-slot · permanent anchors</p><p class="note">Anchors never change. CORE fixed. ROTATE once per quarter. Week 13 = deload. 11 exercises per lifting day.</p>`;
  ['A','B','C','D'].forEach(k=>{html+=`<div class="card" style="${k===q?'border-color:rgba(193,58,54,.45)':''}"><div class="name">${PROG[k].name}${k===q?' · current':''}</div><div class="sets" style="margin-top:6px">Mon Upper A · Tue Lower A · Wed Zone 2 · Thu Upper B · Fri Lower B · Sat Optional Hybrid/Power · Sun Rest</div></div>`});
  Object.keys(PROG[q].days).forEach(dt=>{html+=`<div class="card"><div class="name">${DAY_LABEL[dt]}</div>`;PROG[q].days[dt].forEach(ex=>{html+=`<div style="margin-top:8px;font-size:13px"><span class="role ${ex.role}">${ex.role}</span>${ex.n}. ${ex.name} <span style="color:var(--muted)">${ex.sets}×${ex.reps}</span></div>`});html+=`</div>`});
  return html;
}
function renderLog(){
  const s=state();const keys=Object.keys(s.logs).sort().reverse().slice(0,30);
  let html=`<h1>Log</h1><p class="sub">Completed sessions on this phone</p>`;
  if(!keys.length)return html+`<div class="empty">No sessions yet. Open Today and check off sets.</div>`;
  keys.forEach(k=>{const [date,dayType]=k.split('|');const n=Object.values(s.logs[k].completed||{}).filter(Boolean).length;html+=`<div class="card"><div class="name">${date}</div><div class="sets">${DAY_LABEL[dayType]||dayType} · ${n} sets${s.logs[k].done?' · complete':''}</div></div>`});
  return html;
}
function renderProfile(){
  const p=state().profile;
  return `<h1>Profile</h1><p class="sub">Stored on this phone only</p><div class="card"><label>Name</label><input type="text" value="${(p.name||'').replace(/\"/g,'"')}" onchange="const s=state();s.profile.name=this.value||'Athlete';save(s)"/></div><div class="card"><div class="sets">Streak <b style="color:var(--fg)">${p.streak||0}d</b> · Level <b style="color:var(--fg)">${p.level||1}</b> · XP <b style="color:var(--fg)">${p.xp||0}</b></div></div><p class="note">v10 Quarterly Hybrid · 11 exercises/day · data stays on this phone only.</p><button class="btn ghost" onclick="if(confirm('Wipe all logs?')){localStorage.removeItem(STORE);location.reload()}">Reset local data</button>`;
}
function render(){const app=document.getElementById('app');if(tab==='today')app.innerHTML=renderToday();else if(tab==='program')app.innerHTML=renderProgram();else if(tab==='log')app.innerHTML=renderLog();else app.innerHTML=renderProfile()}
fetch('./program.json').then(r=>r.json()).then(p=>{PROG=p;render()}).catch(e=>{document.getElementById('app').innerHTML='<div class="empty">Failed to load program.json</div>'});
</script>
</body>
</html>
